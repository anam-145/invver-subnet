name: ci-change-alert
# Alerts (Telegram + Slack) when a workflow file is changed, or a change is proposed in a PR.
# Runs on a HOSTED runner only — never self-hosted — so it cannot touch the deploy hosts.
# pull_request_target reads only PR *metadata* (never checks out or runs PR code): safe by design.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ['.github/workflows/**']
  push:
    branches: [main, master]
    paths: ['.github/workflows/**']
permissions:
  contents: read
  pull-requests: read
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            async function notify(o) {
              const ts = new Date().toLocaleString('sv-SE', {timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}) + ' KST';
              const tg = [`${o.emoji} <b>${esc(o.event)}</b>`];
              for (const [l, v] of o.fields) tg.push(`<b>${esc(l)}:</b> <code>${esc(v)}</code>`);
              if (o.warnings && o.warnings.length) { tg.push('<b>Warnings:</b>'); for (const w of o.warnings) tg.push(`• ${esc(w)}`); }
              tg.push(`<a href="${esc(o.url)}">${esc(o.link)}</a>`);
              tg.push(`<i>${esc(ts)}</i>`);
              const sl = [`${o.emoji} *${esc(o.event)}*`];
              for (const [l, v] of o.fields) sl.push(`*${esc(l)}:* \`${esc(v)}\``);
              if (o.warnings && o.warnings.length) { sl.push('*Warnings:*'); for (const w of o.warnings) sl.push(`• ${esc(w)}`); }
              sl.push(`<${o.url}|${esc(o.link)}>`);
              sl.push(`_${esc(ts)}_`);
              const post = async (u, b) => { try { await fetch(u, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(b)}); } catch (e) { core.info('post: ' + e.message); } };
              if (process.env.TG_TOKEN && process.env.TG_CHAT)
                await post(`https://api.telegram.org/bot${process.env.TG_TOKEN}/sendMessage`, {chat_id: process.env.TG_CHAT, text: tg.join('\n'), parse_mode: 'HTML', disable_web_page_preview: true});
              if (process.env.SLACK_URL)
                await post(process.env.SLACK_URL, {attachments: [{color: o.color, blocks: [{type: 'section', text: {type: 'mrkdwn', text: sl.join('\n')}}]}]});
            }
            const {owner, repo} = context.repo;
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              let files = [];
              try {
                const fs = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
                files = fs.filter(f => f.filename.startsWith('.github/workflows/')).map(f => `${f.status} ${f.filename}`);
              } catch (e) { core.info('listFiles: ' + e.message); }
              const fields = [['Repo', `${owner}/${repo}`], ['PR', `#${pr.number}`], ['By', pr.user.login]];
              if (files.length) fields.push([files.length > 1 ? 'Files' : 'File', files.join(', ')]);
              await notify({emoji: '⚠️', color: '#ecb22e', event: 'CI-file change PROPOSED', fields, url: pr.html_url, link: `open PR #${pr.number}`});
            } else {
              const branch = context.ref.replace('refs/heads/', '');
              const set = new Set();
              (context.payload.commits || []).forEach(c => [...(c.added || []), ...(c.modified || []), ...(c.removed || [])].filter(f => f.startsWith('.github/workflows/')).forEach(f => set.add(f)));
              const files = [...set];
              const fields = [['Repo', `${owner}/${repo}`], ['Branch', branch], ['By', context.actor]];
              if (files.length) fields.push([files.length > 1 ? 'Files' : 'File', files.join(', ')]);
              await notify({emoji: '🚨', color: '#e01e5a', event: 'CI-file change LANDED', fields, url: `https://github.com/${owner}/${repo}/commit/${context.sha}`, link: 'open commit'});
            }
