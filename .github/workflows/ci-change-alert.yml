name: ci-change-alert
# Thin caller — the logic lives in anam145-infra/.github/workflows/run-ci-change-alert.yml.
# Edit the reusable (one place for every repo), not this file. See anam145-infra docs/WORKFLOW.md.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths: ['.github/workflows/**']
  push:
    branches: [main, master]
    paths: ['.github/workflows/**']
permissions:
  contents: read
  pull-requests: read
jobs:
  alert:
    uses: anam-145/anam145-infra/.github/workflows/run-ci-change-alert.yml@f59c8abfef883ea69fcc4fd10708c58f144eecef
    secrets: inherit
