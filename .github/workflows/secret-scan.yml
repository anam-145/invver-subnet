name: secret-scan
# Scans PRs and pushes to main/master for committed secrets, using trufflehog with --only-verified
# (so encrypted dotenvx ciphertext — which isn't a live secret — is never flagged; no allowlist needed).
# Hosted runner only. A verified finding fails the job, which ci-notify reports as 🚨 to Telegram + Slack.
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
