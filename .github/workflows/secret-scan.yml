name: secret-scan
# Thin caller → the shared scanner (secret-scan-reusable.yml) in anam145-infra. See
# anam145-infra/docs/WORKFLOW.md "secret-scan — centralization and the exclude policy": a central
# forge-std baseline plus an optional per-repo .github/trufflehog-exclude.txt. A verified finding
# fails the job; ci-notify reports it to the CI channels.
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  secret-scan:
    uses: anam-145/anam145-infra/.github/workflows/secret-scan-reusable.yml@dfbbcc2250c1cd876c3db62c6e621a6aa7eccabd
