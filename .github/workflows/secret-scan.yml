name: secret-scan
# Thin caller → the shared scanner (run-secret-scan.yml) in anam145-infra. See
# anam145-infra/docs/WORKFLOW.md "secret-scan — centralization and the exclude policy": a central
# forge-std baseline plus an optional per-repo .github/trufflehog-exclude.txt. A verified finding
# fails the job; ci-notify reports it to the CI channels.
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  secret-scan:
    uses: anam-145/anam145-infra/.github/workflows/run-secret-scan.yml@18156f8782e71c14eaae9f83a6eb2d9caa36e59c