name: request-review
# Requests the owning CELL TEAM as reviewer on every PR, so all members are set + emailed.
# Needs org secret REVIEW_REQUEST_TOKEN — a token that can resolve+request an org team
# (fine-grained: Members:read + Pull requests:write, or classic read:org + repo). No-op until it's set.
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RT: ${{ secrets.REVIEW_REQUEST_TOKEN }}
        with:
          github-token: ${{ secrets.REVIEW_REQUEST_TOKEN || github.token }}
          script: |
            if (!process.env.RT) { core.info('REVIEW_REQUEST_TOKEN not set — no-op'); return; }
            const {owner, repo} = context.repo;
            let team;
            try {
              const {data} = await github.rest.repos.getContent({owner, repo, path: '.github/CODEOWNERS'});
              const co = Buffer.from(data.content, 'base64').toString();
              const m = co.match(/^\s*\*\s+@anam-145\/([\w-]+)/m);
              team = m && m[1];
            } catch (e) { core.info('no CODEOWNERS: ' + e.message); return; }
            if (!team) { core.info('no cell owner in CODEOWNERS'); return; }
            try {
              await github.rest.pulls.requestReviewers({owner, repo,
                pull_number: context.payload.pull_request.number, team_reviewers: [team]});
              core.info('requested team @' + owner + '/' + team + ' — all members notified');
            } catch (e) { core.info('request failed: ' + e.message); }
