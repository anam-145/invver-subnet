name: request-review
# Auto-requests the owning cell as reviewer on every PR — the CODEOWNERS gap: GitHub won't auto-request
# a team the PR author belongs to, and most PRs are by cell members. This requests it explicitly.
# Reads the cell from .github/CODEOWNERS (* @anam-145/<cell>). pull_request_target: no PR code is run.
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let team;
            try {
              const {data} = await github.rest.repos.getContent({owner, repo, path: '.github/CODEOWNERS'});
              const co = Buffer.from(data.content, 'base64').toString();
              const m = co.match(/^\s*\*\s+@anam-145\/([\w-]+)/m);
              team = m && m[1];
            } catch (e) { core.info('no CODEOWNERS: ' + e.message); return; }
            if (!team) { core.info('no cell owner in CODEOWNERS — skipping'); return; }
            try {
              await github.rest.pulls.requestReviewers({owner, repo,
                pull_number: context.payload.pull_request.number, team_reviewers: [team]});
              core.info('requested @' + owner + '/' + team);
            } catch (e) { core.info('request failed: ' + e.message); }
