# PR auto-labels by the branch's TYPE prefix — matches the commit/branch convention (§9.1b/§9.1c),
# so the label reflects intent (feat/hero-bluer -> feat), not an incidental file. actions/labeler v5.
feat:
  - head-branch: ['^feat/', '^feature/']
fix:
  - head-branch: ['^fix/', '^hotfix/', '^bugfix/']
docs:
  - head-branch: ['^docs/']
chore:
  - head-branch: ['^chore/']
refactor:
  - head-branch: ['^refactor/']
ci:
  - head-branch: ['^ci/']
perf:
  - head-branch: ['^perf/']
test:
  - head-branch: ['^test/']
